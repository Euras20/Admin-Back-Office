<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Paramètres généraux - Commerce Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: "#00435f", "on-primary": "#ffffff", background: "#f7f9ff", "surface-container-lowest": "#ffffff", "on-surface": "#111d27", secondary: "#545f6d"}}}};</script>
  <style>body{font-family:Inter,sans-serif;margin:0;background:#f7f9ff;}</style>
</head>
<body>
  <aside class="fixed left-0 top-0 h-screen w-64 bg-white border-r z-40">
    <div class="h-14 px-4 flex items-center border-b"><span class="material-symbols-outlined text-primary">token</span><span class="ml-2 font-semibold">Commerce Admin</span></div>
    <nav class="p-2 space-y-1 text-sm">
      <a href="products.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100"><span class="material-symbols-outlined text-lg">inventory_2</span> Produits</a>
      <a href="orders.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100"><span class="material-symbols-outlined text-lg">receipt_long</span> Commandes</a>
      <a href="general-settings.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-primary text-on-primary"><span class="material-symbols-outlined text-lg">settings</span> Paramètres généraux</a>
      <a href="settings.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100"><span class="material-symbols-outlined text-lg">storefront</span> Paramètres boutique</a>
      <a href="users.html" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100"><span class="material-symbols-outlined text-lg">manage_accounts</span> Utilisateurs</a>
    </nav>
  </aside>
  <div class="pl-64">
    <header class="h-14 bg-white border-b flex items-center justify-between px-6">
      <span class="font-medium">Paramètres généraux</span>
      <button onclick="logout()" class="text-sm text-secondary">Déconnexion</button>
    </header>
    <main class="p-8 max-w-2xl">
      <div class="bg-white rounded-xl p-6 shadow-sm space-y-6">
        <div>
          <h2 class="font-semibold mb-2">Configuration globale</h2>
          <p class="text-sm text-secondary">Ces paramètres s'appliquent à toutes les boutiques.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Nom de l'organisation</label>
          <input type="text" value="Commerce Group SAS" class="w-full h-10 px-3 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Fuseau horaire</label>
          <select class="w-full h-10 px-3 rounded-lg border"><option>Europe/Paris</option></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Devise par défaut</label>
          <input type="text" value="EUR" readonly class="w-full h-10 px-3 rounded-lg border bg-gray-50" />
        </div>
        <button class="px-6 py-2 bg-primary text-on-primary rounded-lg">Enregistrer</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
  <script>requireAuth();</script>
</body>
</html>
