<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Vérification paiements · Commerce Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="premium.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">C</div>
      <div><div class="sidebar-title">Commerce</div><div class="sidebar-subtitle">Admin</div></div>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Produits</div>
        <a href="products.html" class="nav-item"><span class="material-symbols-outlined icon">inventory_2</span> Liste des produits</a>
        <a href="add-product.html" class="nav-item"><span class="material-symbols-outlined icon">add_circle</span> Ajouter un produit</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Commandes</div>
        <a href="orders.html" class="nav-item"><span class="material-symbols-outlined icon">receipt_long</span> Commandes</a>
        <a href="verification.html" class="nav-item active"><span class="material-symbols-outlined icon">credit_score</span> Vérification paiements</a>
      </div>
    </nav>
  </aside>
  <div class="main">
    <header class="header">
      <div id="storeName" style="font-weight:500;">Marketplace</div>
      <button class="btn" onclick="AdminAPI.logout()">Déconnexion</button>
    </header>
    <div class="content" style="max-width:960px;">
      <div class="page-header">
        <div>
          <h1 class="page-title">Vérification des paiements</h1>
          <div class="page-subtitle" id="count">0 paiements</div>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Commande</th>
              <th>Montant</th>
              <th>Méthode</th>
              <th>Statut</th>
              <th>Soumis le</th>
              <th style="width:180px;"></th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>

      <div class="card" id="detailCard" style="display:none;padding:24px;margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <h3 style="margin:0;font-size:16px;font-weight:600;" id="detailTitle">Détail du paiement</h3>
        </div>
        <div id="detailBody" style="font-size:13.5px;line-height:1.8;background:#fafbfb;border-radius:8px;padding:16px;margin-bottom:16px;"></div>
        <div id="proofs" style="margin-bottom:16px;"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="btnVerify">Valider le paiement</button>
          <button class="btn btn-critical" id="btnReject">Rejeter</button>
        </div>
        <div id="rejectBox" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <label style="display:block;font-size:12px;font-weight:500;margin-bottom:6px;color:var(--text-secondary);">Motif du rejet</label>
          <textarea id="rejectReason" class="input" rows="3" placeholder="Indiquez la raison du rejet…" style="width:100%;resize:vertical;"></textarea>
          <button class="btn" id="btnConfirmReject" style="margin-top:10px;">Confirmer le rejet</button>
        </div>
        <p id="detailError" style="color:var(--critical);margin-top:12px;display:none;font-size:13px;"></p>
      </div>
    </div>
  </div>
  <script src="scripts/api.js"></script>
  <script src="scripts/app.js"></script>
  <script src="scripts/verification.js"></script>
</body>
</html>
