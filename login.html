<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Connexion · Commerce Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="premium.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 380px; padding: 40px; }
    .login-logo { width: 40px; height: 40px; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-logo">C</div>
    <h1 style="text-align:center;font-size:20px;font-weight:600;margin:0 0 4px;">Commerce Admin</h1>
    <p style="text-align:center;color:var(--text-secondary);font-size:13px;margin:0 0 28px;">Back-office</p>
    <form id="loginForm">
      <div class="mb-4">
        <label>Email</label>
        <input id="email" class="input" type="email" value="admin@example.com" required />
      </div>
      <div class="mb-4">
        <label>Mot de passe</label>
        <input id="password" type="password" class="input" value="change-me-on-first-login" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;height:36px;justify-content:center;">Se connecter</button>
    </form>
    <p id="error" style="text-align:center;font-size:12px;color:#c00;margin-top:12px;display:none;"></p>
    <p style="text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:20px;">admin@example.com / change-me-on-first-login</p>
  </div>
  <script src="scripts/api.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
