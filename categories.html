<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Catégories · Commerce Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="premium.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">C</div>
      <div><div class="sidebar-title">Commerce</div><div class="sidebar-subtitle">Admin</div></div>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Produits</div>
        <a href="products.html" class="nav-item"><span class="material-symbols-outlined icon">inventory_2</span> Liste des produits</a>
        <a href="add-product.html" class="nav-item"><span class="material-symbols-outlined icon">add_circle</span> Ajouter un produit</a>
        <a href="categories.html" class="nav-item active"><span class="material-symbols-outlined icon">category</span> Catégories</a>
        <a href="brands.html" class="nav-item"><span class="material-symbols-outlined icon">verified</span> Marques</a>
      </div>
    </nav>
  </aside>
  <div class="main">
    <header class="header">
      <div id="storeName" style="font-weight:500;">Marketplace</div>
      <button class="btn" onclick="logout()">Déconnexion</button>
    </header>
    <div class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Catégories</h1>
          <div class="page-subtitle">Organisation du catalogue</div>
        </div>
        <button class="btn btn-primary" onclick="addCategory()">Nouvelle catégorie</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Nom</th><th>Produits</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    requireAuth();
    function render() {
      const store = getCurrentStore();
      document.getElementById('storeName').textContent = STORES[store].name;
      const products = getProducts(store);
      document.getElementById('list').innerHTML = CATEGORIES[store].map(c => {
        const count = products.filter(p => p.category === c).length;
        return `<tr><td style="font-weight:500;">${c}</td><td class="text-secondary">${count}</td></tr>`;
      }).join('');
    }
    function addCategory() {
      const name = prompt('Nom de la catégorie :');
      if (name && !CATEGORIES[getCurrentStore()].includes(name)) {
        CATEGORIES[getCurrentStore()].push(name);
        render();
      }
    }
    render();
  </script>
</body>
</html>
