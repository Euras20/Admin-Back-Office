<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Ajouter un produit · Commerce Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="premium.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">C</div>
      <div><div class="sidebar-title">Commerce</div><div class="sidebar-subtitle">Admin</div></div>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Produits</div>
        <a href="products.html" class="nav-item"><span class="material-symbols-outlined icon">inventory_2</span> Liste des produits</a>
        <a href="add-product.html" class="nav-item active"><span class="material-symbols-outlined icon">add_circle</span> Ajouter un produit</a>
        <a href="categories.html" class="nav-item"><span class="material-symbols-outlined icon">category</span> Catégories</a>
        <a href="brands.html" class="nav-item"><span class="material-symbols-outlined icon">verified</span> Marques</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Commandes</div>
        <a href="orders.html" class="nav-item"><span class="material-symbols-outlined icon">receipt_long</span> Commandes</a>
      </div>
    </nav>
  </aside>
  <div class="main">
    <header class="header">
      <div id="storeName" style="font-weight:500;">Marketplace</div>
      <button class="btn" onclick="logout()">Déconnexion</button>
    </header>
    <div class="content" style="max-width:720px;">
      <div class="page-header">
        <div>
          <h1 class="page-title">Ajouter un produit</h1>
          <div class="page-subtitle" id="hint">Le formulaire s'adapte à la boutique active.</div>
        </div>
      </div>
      <form id="productForm" class="card" style="padding:24px;">
        <div class="mb-4">
          <label>Nom du produit</label>
          <input name="name" class="input" required />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="mb-4">
          <div>
            <label>Catégorie</label>
            <select name="category" id="categorySelect" class="input"></select>
          </div>
          <div>
            <label>Marque</label>
            <select name="brand" id="brandSelect" class="input"></select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="mb-4">
          <div>
            <label>Prix TTC (€)</label>
            <input name="price" type="number" step="0.01" class="input" required />
          </div>
          <div>
            <label>Stock</label>
            <input name="stock" type="number" value="0" class="input" />
          </div>
        </div>
        <div id="agriFields" class="hidden mb-4">
          <label>Spécifications techniques</label>
          <input name="specs" class="input" placeholder="Puissance, poids, dimensions..." />
        </div>
        <div id="adultFields" class="hidden mb-4">
          <label>Variante / Matériau</label>
          <input name="variant" class="input" placeholder="Taille, couleur, matériau..." />
        </div>
        <div class="mb-4">
          <label>Statut</label>
          <select name="status" class="input">
            <option value="published">Publié</option>
            <option value="draft">Brouillon</option>
          </select>
        </div>
        <div class="flex gap-2" style="padding-top:8px;">
          <a href="products.html" class="btn">Annuler</a>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    requireAuth();
    function populate() {
      const store = getCurrentStore();
      document.getElementById('storeName').textContent = STORES[store].name;
      document.getElementById('hint').textContent = `Formulaire pour ${STORES[store].name}`;
      document.getElementById('categorySelect').innerHTML = CATEGORIES[store].map(c => `<option>${c}</option>`).join('');
      document.getElementById('brandSelect').innerHTML = BRANDS[store].map(b => `<option>${b}</option>`).join('');
      document.getElementById('agriFields').classList.toggle('hidden', store !== 'agri');
      document.getElementById('adultFields').classList.toggle('hidden', store !== 'adult');
    }
    document.getElementById('productForm').onsubmit = function(e) {
      e.preventDefault();
      const fd = new FormData(this);
      addProduct(getCurrentStore(), {
        name: fd.get('name'),
        category: fd.get('category'),
        brand: fd.get('brand'),
        price: parseFloat(fd.get('price')),
        priceHT: parseFloat(fd.get('price')) / 1.2,
        stock: parseInt(fd.get('stock')) || 0,
        status: fd.get('status'),
        image: 'https://via.placeholder.com/200/1a1a1a/ffffff?text=Produit'
      });
      location.href = 'products.html';
    };
    populate();
  </script>
</body>
</html>
